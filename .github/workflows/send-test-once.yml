name: Send one test letter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-test-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send one trending letter
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_ALSO: ${{ secrets.DIGEST_ALSO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          MAIL_FORCE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_trending_digest.py --send --html-out digests/latest.html --text-out digests/latest.txt
