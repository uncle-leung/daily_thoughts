name: Resend events and ideas

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resend-events-ideas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resend both letters
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_ALSO: ${{ secrets.DIGEST_ALSO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          MAIL_FORCE: "1"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: grok-4.7
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fail=0
          python3 scripts/major_events.py --send --html-out digests/events.html --text-out digests/events.txt || fail=1
          python3 scripts/daily_ideas.py --send --html-out digests/ideas.html --text-out digests/ideas.txt || fail=1
          exit "$fail"
