name: Daily ideas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send ideas
        env:
          DIGEST_TO: fisherleung27@qq.com
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          MAIL_FORCE: "1"
        run: python3 scripts/daily_ideas.py --send --html-out digests/ideas.html --text-out digests/ideas.txt

      - name: Keep the letter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ideas
          path: digests/
          if-no-files-found: ignore
