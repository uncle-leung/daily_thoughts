name: Daily ideas

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send ideas
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_ALSO: ${{ secrets.DIGEST_ALSO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          MAIL_FORCE: "1"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: grok-4.7
        run: python3 scripts/daily_ideas.py --send --html-out digests/ideas.html --text-out digests/ideas.txt

      - name: Keep the letter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ideas
          path: digests/
          if-no-files-found: ignore

      - name: Publish the page
        id: save
        if: success()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add mail-state archive docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish today's letters"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Pages to deploy
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-page.yml --ref "${GITHUB_REF_NAME}"
