name: Mail schedule

on:
  schedule:
    # Shanghai is UTC+8. These two lines are the slot times themselves:
    # 08:00, 08:15, 08:30, 08:45 and 18:00, 18:15, 18:30, 18:45.
    - cron: "0,15,30,45 0 * * *"
    - cron: "0,15,30,45 10 * * *"
    # GitHub often starts a schedule late or drops a tick. Keep checking while a
    # letter is still due: 08:00–14:00 Shanghai (UTC 0–5) and 18:00 through 08:00
    # the next morning (UTC 10–23).
    - cron: "2,17,32,47 0-5,10-23 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: shanghai-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send due letters
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_ALSO: ${{ secrets.DIGEST_ALSO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: grok-4.7
        run: python3 scripts/mail_schedule.py

      - name: Remember what was sent
        id: save
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add mail-state archive docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new letters"
          else
            git commit -m "Publish today's letters"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the page
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-page.yml --ref "${GITHUB_REF_NAME}"
