name: Mail schedule

on:
  schedule:
    # Check four times an hour, off the crowded :00 minute.
    # Each letter is sent once, within 100 minutes after its Shanghai slot.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: shanghai-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send due letters
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: grok-4.7
        run: python3 scripts/mail_schedule.py

      - name: Remember what was sent
        id: save
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add mail-state archive docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new letters"
          else
            git commit -m "Publish today's letters"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the page
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-page.yml --ref "${GITHUB_REF_NAME}"
