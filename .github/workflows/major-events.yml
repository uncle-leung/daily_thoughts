name: Major events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send major events
        env:
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_FALLBACK: formsubmit
          MAIL_FORCE: "1"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: grok-4.7
        run: python3 scripts/major_events.py --send --html-out digests/events.html --text-out digests/events.txt

      - name: Keep the letter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-events
          path: digests/
          if-no-files-found: ignore
